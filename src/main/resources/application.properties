spring.application.name=flowboard
server.port=${PORT:8080}

# Persistence: a file based H2 database under ./data so boards survive restarts.
spring.datasource.url=jdbc:h2:file:./data/flowboard
spring.datasource.username=sa
spring.datasource.password=
# The schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JSON: be lenient with hand-written payloads (missing booleans, lower-case enum names).
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.mapper.accept-case-insensitive-enums=true

# AI assistant (optional). Set ANTHROPIC_API_KEY to enable checklist suggestions,
# standup summaries and turning notes into cards.
flowboard.assistant.api-key=${ANTHROPIC_API_KEY:}
flowboard.assistant.model=claude-opus-5-5

# Operations
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Seed a demo board on first start. Set to false for an empty installation.
flowboard.sample-data=true

# Vaadin
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
