spring.application.name=flowboard
server.port=${PORT:8080}

# Persistence: a file based H2 database under ./data so boards survive restarts.
spring.datasource.url=jdbc:h2:file:./data/flowboard
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed a demo board on first start. Set to false for an empty installation.
flowboard.sample-data=true

# Vaadin
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
